<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>iPhone 15 Pro , Titanium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@200;300;400;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
:root{--w:#fff;--s:#C4C4C4;--d:#585858;--dd:#2A2A2A;--acc:#D4A843;--bg:#080808;
  --fh:'Bebas Neue',sans-serif;--fb:'DM Sans',sans-serif;--fm:'DM Mono',monospace}
.grain{pointer-events:none;position:fixed;inset:0;z-index:9999;opacity:.45;
  background:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='0.04'/%3E%3C/svg%3E")}

/* ── START ── */
#start{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s ease}
#start.fade-out{opacity:0;pointer-events:none}
#start-bg{position:absolute;inset:0;overflow:hidden}
#start-bg img{width:100%;height:100%;object-fit:cover;filter:brightness(.28) saturate(1.3);transform:scale(1.05)}
#start-bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(8,8,8,.3) 0%,rgba(8,8,8,.88) 100%)}
#start-content{position:relative;z-index:2;text-align:center;animation:sfu .9s .2s cubic-bezier(.16,1,.3,1) both}
@keyframes sfu{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.s-lbl{font-family:var(--fm);font-size:clamp(9px,1vw,12px);letter-spacing:.28em;color:var(--d);text-transform:uppercase;margin-bottom:2em}
.s-title{font-family:var(--fh);font-size:clamp(64px,10vw,140px);line-height:.88;letter-spacing:.01em;margin-bottom:.6em;
  background:linear-gradient(90deg,#fff 0%,#fff 25%,#aaa 50%,#fff 75%,#fff 100%);background-size:300% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:glim 5s linear infinite}
.s-sub{font-family:var(--fb);font-size:clamp(13px,1.4vw,20px);font-weight:200;color:var(--s);margin-bottom:3em}
#present-btn{background:var(--acc);color:#000;border:none;padding:clamp(12px,1.4vw,18px) clamp(36px,4vw,64px);
  font-family:var(--fb);font-size:clamp(13px,1.2vw,16px);font-weight:600;letter-spacing:.1em;
  border-radius:2px;cursor:pointer;transition:transform .2s,box-shadow .2s}
#present-btn:hover{transform:scale(1.04);box-shadow:0 8px 40px rgba(212,168,67,.35)}
#present-btn:active{transform:scale(.98)}
.s-hint{margin-top:1.8em;font-family:var(--fm);font-size:clamp(8px,.8vw,11px);color:var(--dd);letter-spacing:.16em;text-transform:uppercase}

/* ── PRES ── */
#pres{position:fixed;inset:0;z-index:100;background:var(--bg);visibility:hidden;opacity:0;transition:opacity .6s ease}
#pres.active{visibility:visible;opacity:1}
#slide-wrap{position:absolute;inset:0}
.slide{position:absolute;inset:0;display:flex}

/* ── TRANSITIONS ── */
@keyframes inR {from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:translateX(0)}}
@keyframes inL {from{opacity:0;transform:translateX(-48px)}to{opacity:1;transform:translateX(0)}}
@keyframes outL{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-32px)}}
@keyframes outR{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(32px)}}
.e-inR {animation:inR  .55s cubic-bezier(.16,1,.3,1) both}
.e-inL {animation:inL  .55s cubic-bezier(.16,1,.3,1) both}
.e-outL{animation:outL .3s  ease both}
.e-outR{animation:outR .3s  ease both}

/* ── ELEMENT ANIMS ── */
@keyframes up  {from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes imgI{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:scale(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fi  {from{opacity:0}to{opacity:1}}
@keyframes glim{0%{background-position:-300% center}100%{background-position:300% center}}
.eu{animation:up   .65s cubic-bezier(.16,1,.3,1) both}
.ei{animation:imgI .92s cubic-bezier(.16,1,.3,1) both}
.eg{animation:grow .5s  cubic-bezier(.16,1,.3,1) both;transform-origin:left}
.ef{animation:fi   .7s  ease both}
.gm{background:linear-gradient(90deg,#fff 0%,#fff 25%,#999 50%,#fff 75%,#fff 100%);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:glim 5s linear infinite}

/* ── UI ── */
#ui{position:absolute;inset:0;pointer-events:none;z-index:500;transition:opacity .4s}
#ui.hidden{opacity:0}
#ui>*{pointer-events:all}
#sname{position:absolute;top:clamp(12px,2vh,22px);left:clamp(18px,2.2vw,28px);font-family:var(--fm);font-size:clamp(8px,.8vw,11px);color:var(--d);letter-spacing:.15em;text-transform:uppercase}
#snum {position:absolute;top:clamp(12px,2vh,22px);right:clamp(18px,2.2vw,28px);font-family:var(--fm);font-size:clamp(9px,.85vw,12px);color:var(--d);letter-spacing:.15em}
#nav  {position:absolute;bottom:clamp(14px,2.5vh,26px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px}
.nbtn {width:clamp(28px,3vw,38px);height:clamp(28px,3vw,38px);border-radius:50%;border:1px solid var(--dd);background:rgba(255,255,255,.04);color:var(--w);cursor:pointer;font-size:clamp(15px,1.6vw,22px);display:flex;align-items:center;justify-content:center;transition:opacity .2s,transform .15s}
.nbtn:hover{opacity:.9 !important;transform:scale(1.08)}
.nbtn:disabled{opacity:.18 !important;cursor:default;transform:none}
.ndot {height:3px;border-radius:9999px;border:none;cursor:pointer;background:var(--dd);padding:0;transition:width .35s,background .35s}
.ndot.active{background:var(--w)}
#prog {position:absolute;bottom:0;left:0;height:2px;background:linear-gradient(90deg,var(--acc),transparent);transition:width .5s cubic-bezier(.16,1,.3,1);pointer-events:none}
#hint-h{position:absolute;bottom:clamp(14px,2.5vh,26px);right:clamp(18px,2.2vw,28px);font-family:var(--fm);font-size:clamp(7px,.68vw,9px);color:var(--dd);cursor:pointer;border:none;background:none;padding:6px;letter-spacing:.12em}
#hint-h:hover{color:var(--d)}

/* ── HELPERS ── */
.col{display:flex;flex-direction:column}
.lbl{font-family:var(--fm);font-size:clamp(7px,.75vw,11px);letter-spacing:.24em;color:var(--d);text-transform:uppercase;margin-bottom:1.2em}
.tag{font-family:var(--fm);font-size:clamp(7px,.7vw,10px);letter-spacing:.2em;color:var(--acc);text-transform:uppercase;margin-bottom:.4em}
.rule{height:1px;background:var(--dd);transform-origin:left}
.h1 {font-family:var(--fh);color:var(--w);line-height:.91;letter-spacing:.02em;margin-bottom:.15em}
.body{font-family:var(--fb);color:var(--s);font-weight:300;line-height:1.65}
.bul {display:flex;gap:.65em;margin-bottom:.5em}
.bul-dot{color:var(--acc);font-size:1.1em;line-height:1.6;flex-shrink:0}
.frame{position:relative;overflow:hidden;border-radius:1px}
.frame img{width:100%;height:100%;object-fit:cover;filter:brightness(.85) contrast(1.08);display:block}
.frame-label{position:absolute;bottom:0;left:0;right:0;padding:.35em .7em;background:linear-gradient(0deg,rgba(0,0,0,.88),transparent);display:flex;justify-content:space-between}
.frame-label span{font-family:var(--fm);font-size:clamp(7px,.65vw,9px);letter-spacing:.12em}
.ts{color:var(--acc)}.fn{color:var(--s)}
.stat{border:1px solid var(--dd);padding:clamp(10px,1.3vw,16px) clamp(12px,1.5vw,18px);border-radius:1px}
.stat-val{font-family:var(--fh);color:var(--w);line-height:1;font-size:clamp(32px,4.2vw,58px);margin-bottom:.18em}
.stat-lbl{font-family:var(--fb);color:var(--s);font-weight:300;line-height:1.4;font-size:clamp(9px,.9vw,13px);margin-bottom:.18em}
.stat-src{font-family:var(--fm);color:var(--d);font-size:clamp(7px,.68vw,9px)}
::-webkit-scrollbar{width:2px}::-webkit-scrollbar-thumb{background:#333}
</style>
</head>

  <div class="lbl ef" style="animation-delay:0.05s">Slide 03 &middot; Product Identification</div>\n    <h2 class="h1 eu" style="font-size:clamp(36px,4.8vw,74px);animation-delay:0.12s">PRODUCT<br>IDENTIFICATION</h2>\n    <div class="rule eg" style="animation-delay:0.22s;margin-bottom:1.2em"></div>\n    <p class="body eu" style="animation-delay:.28s;font-size:clamp(10px,1vw,13.5px);margin-bottom:1em"><span style="color:var(--w);font-weight:500">Apple iPhone 15 Pro</span> , released September 2023 (Apple, 2023)</p>\n    <div class="tag">Key Features</div>\n    <div class="bul eu" style="animation-delay:0.34s"><span class="bul-dot">·</span><p class="body" style="font-size:clamp(10px,1vw,13px);margin:0">Titanium build , spacecraft-grade, lighter and stronger than any previous model</p></div>\n    <div class="bul eu" style="animation-delay:0.38s"><span class="bul-dot">·</span><p class="body" style="font-size:clamp(10px,1vw,13px);margin:0">A17 Pro chip , world\'s first 3-nanometer smartphone chip</p></div>\n    <div class="bul eu" style="animation-delay:0.42s"><span class="bul-dot">·</span><p class="body" style="font-size:clamp(10px,1vw,13px);margin:0">48MP main camera , professional-quality photos and video</p></div>\n    <div class="bul eu" style="animation-delay:0.46s"><span class="bul-dot">·</span><p class="body" style="font-size:clamp(10px,1vw,13px);margin:0">From $1,849 AUD , Apple Stores, apple.com/au, Telstra, Optus (Apple, 2023)</p></div>\n    <div style="height:1px;background:var(--dd);margin:1em 0"></div>\n    <div class="tag">Ad Analysed , "Titanium" by TBWA\\Media Arts Lab (GSMArena, 2023)</div>\n    <div class="bul eu" style="animation-delay:0.52s"><span class="bul-dot">·</span><p class="body" style="font-size:clamp(10px,1vw,13px);margin:0">29 sec &middot; no voiceover &middot; no people &middot; text overlays only</p></div>\n    <div class="bul eu" style="animation-delay:0.56s"><span class="bul-dot">·</span><p class="body" style="font-size:clamp(10px,1vw,13px);margin:0">Story: titanium travels from space through Earth\'s atmosphere to your hand</p></div>\n    <div class="bul eu" style="animation-delay:0.6s"><span class="bul-dot">·</span><p class="body" style="font-size:clamp(10px,1vw,13px);margin:0"><span style="color:var(--w)">"From the edge of the universe to the palm of your hand"</span></p></div>\n    <div class="bul eu" style="animation-delay:0.64s"><span class="bul-dot">·</span><p class="body" style="font-size:clamp(10px,1vw,13px);margin:0">At launch: Samsung Galaxy S23 Ultra + Pixel 8 Pro both cheaper , Apple led with craftsmanship to protect price premium positioning (GSMArena, 2023)</p></div>\n  </div>\n  <div class="col" style="flex:1;justify-content:center;padding:0 clamp(12px,2.5vw,30px) 0 clamp(10px,1.5vw,16px);gap:clamp(8px,1vw,14px)">\n    <div class="frame ei" style="width:100%;height:54%"><img src="data:image/jpeg;base64,/9j//gAQTGF2YzYwLjMxLjEwMgD/2wBDAAgEBAQEBAUFBQUFBQYGBgYGBgYGBgYGBgYHBwcICAgHBwcGBgcHCAgICAkJCQgICAgJCQoKCgwMCwsODg4RERT/xACaAAEBAQADAQEBAAAAAAAAAAAAAQIGBAMFBwgBAQEBAQEAAAAAAAAAAAAAAAABAgMEEAEAAQIDBQMIBgcGBgEFAAMAAQIRBAMxcQUyEiEGIoEzUWFCwUETIxQHcoIkkVKSFTWxNKElYlTwQxZz0RdE4VOisiYIk2QndGMRAQACAwEAAwEBAQAAAAAAAAABEQMCMRIyIUETIlH/wAARCALwBaADASIAAhEAAxEA/9oADAMBAAIRAxEAPwD8AAUAAAAeuG9bw9r1eWH9bw9r1QFSFAAAAAAASVSQAAAAElUkBFSQAAEqVKgQAAAAAAAAAEABQAAAAAAAAAWlUpUAAAAAAAAAAAAAAAFBBQEUWAAAAAAAAAAAAABbhYgoWIvVAAAACwAAKAAAAAAAAAAAAAAAAkqkgAAAAEhIIioAlSpUCEhIIABOjMatTozGoNAAAAyAAAAAAAAAAtKLSCgAAAAAAAAAAAKigNRoy1GgLCwkLAKAC0NM0NAsBAAzmcPi0zmcPiDAAoAAADqgKgCkhYBB6Yf1vD2vV5Yf1vD2vUCFSFAAAAAAASVAQVAAAElUkAAEkJAEqVKgQAAAAAAAAAEFABYi6gyNWgtAMjVoLQCRotoAC0FoACFIAAAAAAAAAAAAUEFAQUBBQEWAAAAWEWAFjze9rKoqzJimmOsuWdl+wFWMijE4yOXL6T3gcWyd34zP4MqufB2Kezm9arWyauvol+kU09l90x8PlomaffaF/wB09nsmO7k5c+EA/OY7K74n/Qr/ACbp7J73n/Qr/L/w/Q/96bk/9FH5Qf723LH+jR+rCWr8+jsdvef9Cv8AL/w1HYnfFX+jX+X/AIc9nt1umNMnL/Vg/wB/bujTKy/ygscEjsJvmf8ARr/L/wANR2B31P8Ao1/l/wCHN6vrBwMaZdH5Qk/WHhP/AF0flAOFx9X2+Z/0q3pR9XO95jydTl0/WNhot8uj8mZ+sjKt0 ></div>\n    <div class="tag">Cause</div><p class="body eu" style="animation-delay:.3s;font-size:clamp(10px,1vw,13px);margin-bottom:.7em">Soundtrack builds like a movie trailer , sets the whole mood before the phone ever appears.</p>\n    <div class="tag">Effect</div><p class="body eu" style="animation-delay:.38s;font-size:clamp(10px,1vw,13px);margin-bottom:1.1em">Excitement attaches to the product , viewer is already hooked without knowing why.</p>\n    <div style="height:1px;background:var(--dd);margin-bottom:1.1em"></div>\n    <div class="tag">Overall Strategy</div>\n    <div class="bul eu" style="animation-delay:0.46s"><span class="bul-dot">·</span><p class="body" style="font-size:clamp(10px,1vw,13px);margin:0">Sight + sound + feeling hit simultaneously</p></div>\n    <div class="bul eu" style="animation-delay:0.52s"><span class="bul-dot">·</span><p class="body" style="font-size:clamp(10px,1vw,13px);margin:0"><span style="color:var(--w)">"From the edge of the universe to the palm of your hand"</span> , one line turns a phone frame into a story about rarity and power</p></div>\n    <div class="bul eu" style="animation-delay:0.58s"><span class="bul-dot">·</span><p class="body" style="font-size:clamp(10px,1vw,13px);margin:0">The price is never mentioned once</p></div>\n  </div>\n</div>', '<div class="slide">\n  <div class="col" style="width:56%;justify-content:center;padding:clamp(0px,5vw,64px) clamp(14px,5.5vw,68px);overflow-y:auto">\n    <div class="lbl ef" style="animation-delay:0.05s">Slide 07 &middot; Effectiveness Analysis</div>\n    <h2 class="h1 eu" style="font-size:clamp(38px,5.2vw,76px);animation-delay:0.12s">EFFECTIVE-<br>NESS</h2>\n    <div class="rule eg" style="animation-delay:0.22s;margin-bottom:1em"></div>\n    <div class="eu" style="animation-delay:.28s;display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1vw,14px);margin-bottom:1.1em">\n      <div class="stat eu" style="animation-delay:0.28s"><div class="stat-val">38.7M</div><div class="stat-lbl">Units shipped H1 2024</div><div class="stat-src">Counterpoint Research, 2024</div></div>\n      <div class="stat eu" style="animation-delay:0.36s"><div class="stat-val">93%</div><div class="stat-lbl">Customer loyalty rate</div><div class="stat-src">Omdia, 2024</div></div>\n    </div>\n    <div class="tag">Sales Performance</div>\n    <div class="bul eu" style="animation-delay:0.42s"><span class="bul-dot">·</span><p class="body" style="font-size:clamp(10px,1vw,13px);margin:0">Multiple factors: chip, carrier deals, trade-ins , but the ad made a real difference</p></div>\n    <div class="bul eu" style="animation-delay:0.46s"><span class="bul-dot">·</span><p class="body" style="font-size:clamp(10px,1vw,13px);margin:0">Framed phone as crafted + exclusive before specs shown &rarr; $1,849 felt reasonable to a status-motivated segment</p></div>\n    <div class="bul eu" style="animation-delay:0.5s"><span class="bul-dot">·</span><p class="body" style="font-size:clamp(10px,1vw,13px);margin:0">Premium advertising removes the biggest barrier: the feeling the price is too high</p></div>\n    <div style="height:1px;background:var(--dd);margin:.9em 0"></div>\n    <div class="tag">Brand Loyalty</div>\n    <div class="bul eu" style="animation-delay:0.54s"><span class="bul-dot">·</span><p class="body" style="font-size:clamp(10px,1vw,13px);margin:0">93% reflects overall brand strength, not just this campaign</p></div>\n    <div class="bul eu" style="animation-delay:0.58s"><span class="bul-dot">·</span><p class="body" style="font-size:clamp(10px,1vw,13px);margin:0">Craftsmanship narrative gives premium segment a real reason to upgrade, not switch</p></div>\n    <div class="bul eu" style="animation-delay:0.62s"><span class="bul-dot">·</span><p class="body" style="font-size:clamp(10px,1vw,13px);margin:0">Keeps a genuine competitive advantage as Android closes the spec gap</p></div>\n  </div>\n  <div class="col" style="flex:1;justify-content:center;padding:0 clamp(12px,2.5vw,30px) 0 cl ra vs Apple iPhone 15 Pro: Full comparison. https://www.gsmarena.com</p></div><div class="eu" style="animation-delay:0.65s;display:flex;gap:clamp(12px,1.5vw,20px)"><span style="font-family:var(--fm);font-size:clamp(8px,0.8vw,10px);color:#D4A843;padding-top:2px;flex-shrink:0;letter-spacing:.08em">06</span><p class="body" style="font-size:clamp(10px,1vw,13px);margin:0">Omdia. (2024). Smartphone Brand Loyalty and Recall Index 2024. https://omdia.tech.informa.com</p></div>\n  </div>\n  <div style="margin-top:auto;padding-top:clamp(14px,2vw,26px);display:flex;align-items:center;gap:12px">\n    <div style="width:16px;height:1px;background:var(--d)"></div>\n    <p style="font-family:var(--fm);font-size:clamp(8px,0.8vw,10px);color:var(--d);letter-spacing:.1em">Jayden Rasilim &middot; Year 10 Commerce &middot; Hunters Hill High School &middot; 2026</p>\n  </div>\n</div>'];
const TITLES=['Title', 'Ad', 'Product ID', 'Target Market', 'Techniques I', 'Techniques II', 'Effectiveness I', 'Effectiveness II', 'Recommendations', 'References'];
const N=SLIDES.length;
let cur=0,busy=false,uiHidden=false;
const wrap=document.getElementById('slide-wrap'),dots=document.getElementById('dots'),
      prev=document.getElementById('prev'),next=document.getElementById('next'),
      prog=document.getElementById('prog'),sname=document.getElementById('sname'),
      snum=document.getElementById('snum'),ui=document.getElementById('ui'),
      pres=document.getElementById('pres'),start=document.getElementById('start');

for(let i=0;i<N;i++){
  const d=document.createElement('button');
  d.className='ndot';d.style.width='3px';
  d.onclick=()=>go(i);dots.appendChild(d);
}

function updateChrome(){
  prog.style.width=`${((cur+1)/N)*100}%`;
  sname.textContent=TITLES[cur];
  snum.innerHTML=String(cur+1).padStart(2,'0')+'<span style="color:var(--dd)"> / '+String(N).padStart(2,'0')+'</span>';
  prev.disabled=cur===0; next.disabled=cur===N-1;
  [...dots.children].forEach((d,i)=>{d.classList.toggle('active',i===cur);d.style.width=i===cur?'22px':'3px';});
}

function go(n){
  if(busy||n<0||n>=N||n===cur)return;
  busy=true;
  const dir=n>cur?1:-1;
  const old=wrap.querySelector('.slide');
  if(old){old.classList.add(dir>0?'e-outL':'e-outR');setTimeout(()=>old.remove(),300);}
  cur=n;
  setTimeout(()=>{
    const div=document.createElement('div');
    div.innerHTML=SLIDES[cur];
    const s=div.firstElementChild;
    s.classList.add(dir>0?'e-inR':'e-inL');
    wrap.appendChild(s);
    updateChrome();
    setTimeout(()=>{busy=false;},560);
  },60);
}

function initSlide(){
  const div=document.createElement('div');
  div.innerHTML=SLIDES[0];
  wrap.appendChild(div.firstElementChild);
  updateChrome();
}

document.getElementById('present-btn').onclick=()=>{
  const el=document.documentElement;
  if(el.requestFullscreen)el.requestFullscreen();
  else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
  start.classList.add('fade-out');
  setTimeout(()=>{start.style.display='none';pres.classList.add('active');initSlide();},800);
};

function toggleUI(){uiHidden=!uiHidden;ui.classList.toggle('hidden',uiHidden);}
document.getElementById('hint-h').onclick=toggleUI;

document.addEventListener('keydown',e=>{
  if(!pres.classList.contains('active'))return;
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(cur+1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1);}
  if(e.key==='h'||e.key==='H')toggleUI();
  if(e.key==='Escape'&&document.fullscreenElement)document.exitFullscreen();
});

prev.onclick=()=>go(cur-1);
next.onclick=()=>go(cur+1);
</script>
